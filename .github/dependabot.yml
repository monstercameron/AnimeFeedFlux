# Every dependency is a permanent decision made in thirty seconds — so updates arrive as pull
# requests to be read, not as a stream to be rubber-stamped. Monthly, grouped, and deliberately
# quiet.
#
# First-party packages (GoWebComponents, GoGRPCBridge, SchemaFlux) are ignored on purpose. They are
# ours, they move when this project decides they move, and a bot bumping SchemaFlux mid-phase would
# change generation behaviour without anyone reading why.

version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
      grpc-and-proto:
        patterns: ["google.golang.org/*"]
    ignore:
      - dependency-name: "github.com/monstercameron/*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(ci)"

  # The image's base layers age too, and a distroless digest that never moves is a CVE nobody is
  # looking at.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(docker)"
