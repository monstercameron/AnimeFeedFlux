# CI — the gate that dev must pass before it can become main.
#
# This runs on a repository that currently has no Go code, and it must be green
# anyway. A workflow that is red from the day it is added trains everyone to
# ignore it, and by the time real code arrives nobody trusts the badge. So every
# Go job detects go.mod and skips with a notice until Phase A0 lands.
#
# It is also the authoritative gate for the things the pre-commit hook
# deliberately does NOT run (PLAN.md §17.2): the race detector, which cannot run
# on the maintainer's windows/arm64 machine at all, and the external feed
# validator.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run on the same ref. main is excluded:
  # cancelling a run on main would cancel the verification a promotion depends on.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect:
    name: Detect project state
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.check.outputs.has_go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f go.mod ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
            echo "Go module present — full gate active."
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No go.mod yet (pre-A0). Go jobs will skip."
          fi

  docs:
    name: Docs and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The spec is the product right now, so its integrity is a real gate.
      # A dangling section reference has already shipped twice in this repo.
      # Some sections number their list items as citable anchors (§9's eight
      # generation steps, §21's open questions) rather than as subsection
      # headings. Those declare themselves with an `<!-- anchors: §N.a-§N.b -->`
      # marker, so this check stays general instead of accumulating hardcoded
      # exceptions — which is what it had after the first two, and would have
      # kept growing.
      #
      # Not every `§` is ours. `XML 1.0 §2.11` cites the XML specification, and
      # reading it as a reference to PLAN.md §2.11 reported a dangling link for
      # a citation that was correct. The fix belongs here rather than in the
      # prose: the alternative is rewriting accurate citations to appease a
      # check, which is the check training the documents instead of the other
      # way round. External citations are stripped by the spec name that
      # precedes them, so adding a new one means adding it to this list.
      - name: Every plan reference resolves to a real section
        run: |
          fail=0
          ext='XML 1\.0|XML|RFC [0-9]+|Atom 1\.0|RSS 2\.0|JSON Feed 1\.[01]|HTTP/1\.1|SP 800-63B|OWASP'
          sed -E "s#(${ext}) §[0-9]+(\.[0-9]+)?##g" \
            PLAN.md TODOS.md AGENTS.md CONTRIBUTING.md README.md 2>/dev/null \
            | grep -ohE '§[0-9]+(\.[0-9]+)?' \
            | sed 's/§//' | sort -u > /tmp/refs.txt
          while IFS= read -r r; do
            [ -n "$r" ] || continue
            grep -qE "^#{2,3} ${r}[. ]" PLAN.md && continue
            base=${r%%.*}
            grep -qE "<!-- anchors: §${base}\." PLAN.md && continue
            echo "::error::dangling reference §$r"
            fail=1
          done < /tmp/refs.txt
          [ "$fail" = 0 ] && echo "all § references resolve"
          exit $fail

      # Only DEFINITIONS count — a line that opens with a checkbox. The first
      # version matched every occurrence anywhere, so a task that another task
      # legitimately cross-references (OQ-04 naming what it blocks) was reported
      # as a duplicate of itself. Cross-references are the point of stable IDs;
      # a check that punishes them would train people to stop writing them.
      - name: Task IDs are unique
        run: |
          # shellcheck disable=SC2016  # backticks are markdown, not substitution
          dupes=$(grep -oE '^- \[.\] `[A-Z]+[0-9]*-[0-9]+[a-z]?`' TODOS.md \
                  | grep -oE '`[^`]+`' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::duplicate task IDs: $dupes"; exit 1
          fi
          echo "task IDs unique ($(grep -cE '^- \[.\] `[A-Z]' TODOS.md) defined)"

      - name: No secrets committed
        run: |
          # shellcheck disable=SC2016  # $ here are regex anchors, not expansions
          if git ls-files | grep -qE '(^|/)\.env$|\.key$|\.db$'; then
            echo "::error::secret or database file is tracked"; exit 1
          fi
          echo "no secret material tracked"

  hooks:
    name: Hooks, scripts, workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A malformed workflow fails the run BEFORE any job starts, produces no
      # job list, and reports only "this run likely failed because of a workflow
      # file issue" — which names no file, line, or reason. That happened on the
      # first run of this very file (a double-quoted string in an expression;
      # GitHub expressions only accept single quotes). Linting them here means
      # the next one is caught with a line number instead of a scavenger hunt.
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Shell syntax
        run: |
          for s in .githooks/* scripts/*.sh; do
            sh -n "$s" || { echo "::error::$s has a syntax error"; exit 1; }
          done
          echo "all shell files parse"

      - name: Hook test suite
        run: sh scripts/test-hooks.sh
      - name: Hooks are executable and LF
        run: |
          for h in .githooks/*; do
            [ -x "$h" ] || { echo "::error::$h is not executable"; exit 1; }
            if head -c 200 "$h" | grep -q $'\r'; then
              echo "::error::$h has CRLF — it will fail as 'bad interpreter'"; exit 1
            fi
          done
          echo "hooks executable, LF endings"

  go:
    name: Build, vet, test
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::not gofmt'd:"; echo "$out"; exit 1; fi

      - run: go build ./...
      - run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      # -race is the reason this job exists: it CANNOT run on the maintainer's
      # windows/arm64 machine, so this ubuntu job is the ONLY place it ever
      # happens (§17.2). Never weaken this to plain `go test` to make a run
      # green — that would silence the one place data races are ever caught.
      #
      # No -short here, deliberately: the pre-commit hook runs -short so local
      # commits stay fast, which means the 90-day soak (internal/generate),
      # the poll-load check (internal/publish), and the fuzz seed corpus are
      # SKIPPED everywhere except here. If this job ever gained -short, those
      # tests would stop running anywhere at all.
      - name: "go test -race (full suite, no -short — the ONLY place -race runs)"
        run: go test -race ./...
        env:
          # RULE-1: the default suite must not call a paid API. Asserting the
          # variable is unset here means a test that quietly needs one fails in
          # CI rather than silently billing.
          AFF_LIVE_LLM: ""

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      # Coverage ratchet (§17.2): the number may not go down. Chasing a
      # percentage produces tests written to touch lines rather than assert
      # behaviour, so this only stops erosion — it never demands the number
      # climb, and it never rewrites its own floor. See
      # scripts/coverage-ratchet.sh for the full reasoning and the tolerance
      # that absorbs -shuffle=on noise.
      #
      # Measured over `go list ./... | grep -v /gen/`, not `./...`: gen/aff/v1
      # is protoc output, ~3,600 statements no human wrote, and counting it
      # dragged the reported total from 79% to 62% while saying nothing about
      # any code in this repository. See the Makefile's COVERPKG comment.
      - name: Coverage ratchet
        run: |
          # shellcheck disable=SC2046  # the package list is MEANT to word-split
          go test -coverprofile=cover.out $(go list ./... | grep -v '/gen/')
          pct=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${pct}%"
          echo "$pct" > coverage.txt
          sh scripts/coverage-ratchet.sh cover.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

      # Mutation fuzzing on every push, not only when someone remembers to run
      # it by hand (§17.3): the HTML sanitizer, the URL normalizer's
      # idempotence property, and the three renderers' well-formedness. Each
      # target gets a bounded 30s budget so the job stays fast but still
      # mutates on every push. The corpus these runs discover is written
      # under `$(go env GOCACHE)/fuzz`, which is the same tree setup-go's
      # `cache: true` above already persists between runs (it hashes and
      # restores GOCACHE wholesale), so no extra cache step is needed for the
      # corpus to carry forward run to run.
      - name: "Fuzz targets, 30s each (seed corpus only runs here — -short skips it)"
        run: |
          set -eu
          targets="
            internal/render:FuzzRSSWellFormed
            internal/render:FuzzAtomWellFormed
            internal/render:FuzzJSONFeedValid
            internal/sanitize:FuzzHTMLNeverEmitsDisallowed
            internal/urlnorm:FuzzNormalizeIdempotent
          "
          for t in $targets; do
            pkg="./${t%%:*}"
            fn="${t##*:}"
            echo "::group::fuzz $fn ($pkg)"
            go test "$pkg" -run '^$' -fuzz "^${fn}\$" -fuzztime=30s
            echo "::endgroup::"
          done
        env:
          AFF_LIVE_LLM: ""

  feeds:
    name: Feed validator
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Gates on warnings as well as errors (§5.6). Slack's own troubleshooting
      # advice is to run the feed through a validator, so this is a
      # compatibility gate, not a tidiness one.
      - name: make validate
        run: make validate

  wasm:
    name: WASM build (web/)
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Most of web/ is behind the js/wasm build tag, so `go build ./...` on
      # the host never compiles it — a break here passes the `go` job clean.
      # `make web` runs GOOS=js GOARCH=wasm through web/build.sh and stages
      # the bundle into web/dist/.
      - name: make web
        run: make web

      # scripts/check-wasm-secrets.sh is being written this round (greps the
      # built bundle for the session cookie name and storage sinks). It can
      # only run once a bundle exists, which is here, right after the build.
      # Guarded so its absence is a skip, not a failure.
      - name: Check wasm bundle for leaked secrets
        run: |
          if [ -f scripts/check-wasm-secrets.sh ]; then
            # No argument: the script defaults to web/dist/app.wasm, which the
            # `make web` step above has just built. Passing a DIRECTORY makes it
            # print usage and exit 2 (its loud-skip code) — the check would not
            # run, and the step would fail for a reason unrelated to secrets.
            sh scripts/check-wasm-secrets.sh
          else
            echo "::notice::scripts/check-wasm-secrets.sh not present yet — skipping"
          fi

  i18n:
    name: i18n gate
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # D6-20: gating, not reporting-only. The catalogue migration (D6 series)
      # is done and `make i18n-lint` reports zero (see .github/i18n-baseline.txt),
      # so a literal in web/ now fails this job for real.
      - name: i18n lint
        run: make i18n-lint

      # D6-21: the ratchet baseline is seeded and committed at
      # .github/i18n-baseline.txt (currently 0). This step is unconditional —
      # a missing baseline is itself a failure (see i18nlint.Ratchet's doc
      # comment), not a silent skip; a fresh checkout must not be able to
      # bypass the gate by omitting the file.
      - name: i18n ratchet
        run: make i18n-ratchet

  container:
    name: Container checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/check-container.sh is being written this round. Runs where
      # Docker is available — ubuntu-latest runners ship it preinstalled.
      # Guarded so its absence is a skip, not a failure.
      - name: check-container.sh
        run: |
          if [ -f scripts/check-container.sh ]; then
            sh scripts/check-container.sh
          else
            echo "::notice::scripts/check-container.sh not present yet — skipping"
          fi

  # A single required check to point branch protection at, so the required-check
  # list does not need editing every time a job is added or renamed.
  gate:
    name: CI gate
    needs: [docs, hooks, go, feeds, wasm, i18n, container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "::error::a required job did not pass"; exit 1 ;;
          esac
          echo "gate green"
