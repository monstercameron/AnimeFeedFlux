# Shared rate-limit zones — installed into /etc/nginx/conf.d/, NOT sites-enabled.
#
# This file exists because `limit_req_zone` is only valid in nginx's `http`
# context. It was previously declared inside the publish vhost's `server {}`
# block, where nginx refuses the whole config with
#
#     "limit_req_zone" directive is not allowed here
#
# so `nginx -t` failed and the publish plane's rate limit did not exist at all.
# Debian/Ubuntu's stock /etc/nginx/nginx.conf does `include
# /etc/nginx/conf.d/*.conf;` inside `http`, which is exactly the context the
# directive needs — hence a separate file here rather than a vhost edit.
#
# Declaring the zone once, centrally, is also the correct shape rather than a
# workaround: a zone is shared state (a fixed slab of shared memory keyed by
# client address), so the production publish vhost and the generated staging
# vhost both referencing `zone=feeds` share one counter, which is what an
# operator polling both from one address should get. A per-vhost zone would
# have meant a second slab and two independent budgets for one client.

# A feed reader that ignores the TTL is the normal case, so cap the damage.
# Generous enough that honest polling never trips it (PLAN.md §6): 60r/m is one
# request per second sustained, against feeds that advertise a 15-minute
# max-age.
limit_req_zone $binary_remote_addr zone=feeds:10m rate=60r/m;
