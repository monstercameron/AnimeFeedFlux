# Publish plane — the only thing open to the world (PLAN.md §2, §6).
#
# Read-only feeds. No admin surface is reachable from this vhost at all; the
# control plane lives on its own hostname with an IP allowlist.

server {
    listen 80;
    listen [::]:80;
    server_name anime.earlcameron.com;

    # Certbot writes here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anime.earlcameron.com;

    ssl_certificate     /etc/letsencrypt/live/anime.earlcameron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anime.earlcameron.com/privkey.pem;

    # The app never sees a request that nginx did not forward.
    access_log /var/log/nginx/animefeedflux-access.log;
    error_log  /var/log/nginx/animefeedflux-error.log;

    # No version banner. The publish plane gives away nothing about what it is.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Content-Security-Policy is deliberately NOT set here. The app sets it
    # per route (internal/publish's defaultCSP and embed.go's embedCSP),
    # because /embed/{slug} exists specifically to be framed by other sites
    # while every other route must not be — a distinction nginx cannot make
    # from this block. An add_header here would not override the app's value
    # either: browsers apply MULTIPLE CSP headers as an intersection, so a
    # blanket `frame-ancestors 'none'` at this layer would silently un-frame
    # the one route whose whole purpose is to be framed.
    #
    # Tightening the app's default policy beyond frame-ancestors (adding
    # default-src 'none' for the permalink and index pages, which contain no
    # script or style of their own) is tracked as TODOS.md A9-EM08 and belongs
    # in internal/publish, not here.

    # The `feeds` zone is declared in deploy/nginx/aff-limits.conf, installed
    # into /etc/nginx/conf.d/. It CANNOT be declared here: limit_req_zone is
    # http-context only, and nginx rejects the entire config if it appears in a
    # server block — which is where it used to live, so this rate limit was
    # never actually in force. See that file's header.
    # Deploy hook: the ONE mutating endpoint on the publish plane, proxied to
    # the loopback-only `webhook` receiver (deploy/autoupdate/). World-
    # reachable by necessity — GitHub's runners must reach it, and the admin
    # vhost's IP allowlist would keep them out — and gated by the shared
    # secret the receiver's trigger-rule checks; a request without it is a
    # 200 with no hook fired (webhook's semantics), and a request WITH it can
    # at worst start a no-op update check. Exact-match location so nothing
    # else routes near the app.
    location = /internal/deploy-hook {
        limit_req zone=feeds burst=5 nodelay;
        proxy_pass http://127.0.0.1:9000/hooks/aff-deploy;
        proxy_http_version 1.1;
        proxy_set_header X-Aff-Deploy-Token $http_x_aff_deploy_token;
    }

    location / {
        limit_req zone=feeds burst=30 nodelay;

        proxy_pass http://127.0.0.1:9310;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conditional GET is the whole performance story here (§5.4). nginx must
        # pass the validators through untouched, or every poll becomes a full
        # 200 and the 304 path — the one that costs nothing — never fires.
        proxy_set_header If-None-Match     $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;

        # The app already gzips from its cache and sets Vary: Accept-Encoding.
        # Letting nginx compress again would waste CPU re-doing settled work.
        gzip off;

        proxy_read_timeout 30s;
    }
}
