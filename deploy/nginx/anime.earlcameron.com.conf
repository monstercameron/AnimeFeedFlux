# Publish plane — the only thing open to the world (PLAN.md §2, §6).
#
# Read-only feeds. No admin surface is reachable from this vhost at all; the
# control plane lives on its own hostname with an IP allowlist.

server {
    listen 80;
    listen [::]:80;
    server_name anime.earlcameron.com;

    # Certbot writes here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name anime.earlcameron.com;

    ssl_certificate     /etc/letsencrypt/live/anime.earlcameron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anime.earlcameron.com/privkey.pem;

    # The app never sees a request that nginx did not forward.
    access_log /var/log/nginx/animefeedflux-access.log;
    error_log  /var/log/nginx/animefeedflux-error.log;

    # No version banner. The publish plane gives away nothing about what it is.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # A feed reader that ignores the TTL is the normal case, so cap the damage.
    # Generous enough that honest polling never trips it (§6).
    limit_req_zone $binary_remote_addr zone=feeds:10m rate=60r/m;

    location / {
        limit_req zone=feeds burst=30 nodelay;

        proxy_pass http://127.0.0.1:9310;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conditional GET is the whole performance story here (§5.4). nginx must
        # pass the validators through untouched, or every poll becomes a full
        # 200 and the 304 path — the one that costs nothing — never fires.
        proxy_set_header If-None-Match     $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;

        # The app already gzips from its cache and sets Vary: Accept-Encoding.
        # Letting nginx compress again would waste CPU re-doing settled work.
        gzip off;

        proxy_read_timeout 30s;
    }
}
