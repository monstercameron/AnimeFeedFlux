# Control plane — gRPC over WebSocket, IP-allowlisted (PLAN.md §2, §4, §15.4).
#
# Everything mutable in the system is behind this vhost. The allowlist is
# defence in depth, not the control: authentication is (§4), because a single
# admin with no authorization model means a leaked session is total.

server {
    listen 80;
    listen [::]:80;
    server_name admin.anime.earlcameron.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.anime.earlcameron.com;

    ssl_certificate     /etc/letsencrypt/live/admin.anime.earlcameron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.anime.earlcameron.com/privkey.pem;

    access_log /var/log/nginx/animefeedflux-admin-access.log;
    error_log  /var/log/nginx/animefeedflux-admin-error.log;
    server_tokens off;

    # Home IP only, same pattern as the droplet's SSH rule. Replace the
    # placeholder at install time; leaving it as 0.0.0.0/0 would silently make
    # the admin plane public, which is the one mistake this file exists to
    # prevent.
    allow 203.0.113.0/24;   # PLACEHOLDER — set to the home IP before enabling
    deny all;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:9311;

        # These three are load-bearing for gRPC-over-WebSocket (§15.4). When the
        # admin app "does not work", check them first.
        #
        # 1. Without HTTP/1.1 and the Upgrade/Connection headers the WebSocket
        #    upgrade never happens and the bridge looks broken.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;

        # 2. The default read timeout drops an idle admin socket mid-session,
        #    which reads as a bridge bug rather than a proxy timeout.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # 3. With buffering ON, nginx holds server-streamed frames until its
        #    buffer fills, so SampleStream and RunService.Watch arrive in one
        #    lump at the end and the streaming UI silently degrades to a
        #    spinner. This is the subtlest of the three.
        proxy_buffering off;
    }
}
